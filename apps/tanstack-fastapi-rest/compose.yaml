# Canonical benchmark stack for a SPA + API pair (plan §3.1/§3.4).
# One variant = one stack: db + rig-owned seeder + the API + the static SPA.
#
# The rig drives this with `docker compose -p bench-tanstack-fastapi-rest-<runId>`
# and passes ports/caps/the SPA's API URL as environment variables.

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: bench
      POSTGRES_PASSWORD: bench
      POSTGRES_DB: bench
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
    deploy:
      resources:
        limits:
          cpus: "${DB_CPUS:-2}"
          memory: "${DB_MEMORY_MB:-2048}M"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bench -d bench"]
      interval: 2s
      timeout: 3s
      retries: 30

  seeder:
    image: bench-seeder:local
    profiles: ["seed", "reset", "verify"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_URL: postgresql://bench:bench@db:5432/bench

  api:
    build:
      context: ./fastapi-rest
    depends_on:
      db:
        condition: service_healthy
    environment:
      # The app reads POSTGRES_URL and PORT (app/config.py); POSTGRES_URL is the
      # same in-stack URL the seeder uses.
      POSTGRES_URL: postgresql://bench:bench@db:5432/bench
      PORT: "4000"
      # The API reflects the request origin (app/main.py: allow_origin_regex=.*),
      # so no allowlist is required; CORS_ORIGIN is passed by the rig for parity
      # with APIs that do need one.
      CORS_ORIGIN: "${CORS_ORIGIN:-http://localhost:3015}"
    ports:
      - "${API_PORT:-4015}:4000"
    deploy:
      resources:
        limits:
          cpus: "${APP_CPUS:-2}"
          memory: "${APP_MEMORY_MB:-2048}M"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/healthz || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 30

  spa:
    build:
      context: ./tanstack-rest
      args:
        # Baked in at build time; the rig resolves {{API_PORT}} before building.
        VITE_API_URL: "${VITE_API_URL:-http://localhost:4015}"
    ports:
      - "${SPA_PORT:-3015}:80"
    deploy:
      resources:
        limits:
          cpus: "${APP_CPUS:-2}"
          memory: "${APP_MEMORY_MB:-2048}M"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 30
