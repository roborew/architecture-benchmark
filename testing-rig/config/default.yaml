# Default experiment config (normative `scenarios:` shape — plan §4).
# All 14 DB-backed variants. `next-template` is excluded deliberately: it has
# no database, so it cannot participate in DB-backed runs (plan §8.4).

schemaVersion: 1
name: medium-crud-volume-100
variants:
  - next-actions
  - next-drizzle
  - next-prisma
  - next-trpc
  - next-orpc
  - tanstack-start-react
  - tanstack-start-solid
  - tanstack-express-rest
  - tanstack-fastify-rest
  - tanstack-flask-rest
  - tanstack-fastapi-rest
  - tanstack-elixir-rest
  - tanstack-express-graphql
  - tanstack-express-orpc
trials: 5
variantOrder: rotate

fixture:
  seedVersion: 1
  seed: 42
  projectCount: 50
  userCount: 200
  taskCount: 50000
  commentCount: 100000
  baseTimestamp: "2025-01-01T00:00:00Z"
  statusPercent: { todo: 50, "in progress": 30, done: 20 }
  workingSetFraction: 0.20

reset:
  betweenPhases: true
  betweenTrials: true
  method: database-recreate

browser:
  engine: chromium
  workers: 1
  warmupSamples: 10
  measuredSamples: 30
  viewport: { width: 1365, height: 768 }
  cacheProfile: cold-browser-context
  prefetch: disabled
  operations: [list, detail, create, update, delete]

scenarios:
  - id: volume-100-writes
    kind: volume
    counts: { list: 400, detail: 200, create: 100, update: 100, delete: 100 }
    concurrency: 5
    maxAttemptsPerOperation: 110
    maxDurationSeconds: 600
    resetBefore: true
  - id: capacity-mixed
    kind: capacity
    weights: { list: 40, detail: 20, create: 15, update: 15, delete: 10 }
    ratesPerSecond: [5, 10, 20, 40]
    durationPerStepSeconds: 180
    preallocatedVUs: 50
    maxVUs: 200
    resetBefore: true

network:
  browserToAppAddedRttMs: 0
  # Phase-1 cohort has no separate backend service: this must stay 0
  # (the validator rejects nonzero values — plan §7).
  appToApiAddedRttMs: 0

resources:
  appCpus: 2
  appMemoryMb: 2048
  dbCpus: 2
  dbMemoryMb: 2048

load:
  # A trial whose generator process exceeds this share of a core is rejected
  # as generator-saturated, not counted as an app measurement (plan §6.5).
  generatorMaxCpuPercent: 75

report:
  keepRawSamples: true
  outputFormats: [json, csv, html]
