# Large load @ 4 CPU / 4096 MB
# One cell of the load x resource matrix (see pnpm rig:matrix). The only
# difference between the large files is the resource envelope: they all
# share the same workload so the pair isolates load from hardware.
# NOTE: the read VUs derive from appCpus (VUs = appCpus x 2), so a bigger
# envelope also offers more load -- use --resources with a base config to hold
# offered load constant instead.

schemaVersion: 1
name: large
variants:
  - next-actions
  - next-drizzle
  - next-prisma
  - next-trpc
  - next-orpc
  - tanstack-start-react
  - tanstack-start-solid
  - tanstack-express-rest
  - tanstack-fastify-rest
  - tanstack-flask-rest
  - tanstack-fastapi-rest
  - tanstack-elixir-rest
  - tanstack-express-graphql
  - tanstack-express-orpc
trials: 3
variantOrder: rotate

fixture:
  seedVersion: 1
  seed: 42
  projectCount: 100
  userCount: 500
  taskCount: 100000
  commentCount: 200000
  baseTimestamp: "2025-01-01T00:00:00Z"
  statusPercent: { todo: 50, "in progress": 30, done: 20 }
  workingSetFraction: 0.20

reset:
  betweenPhases: true
  betweenTrials: true
  method: database-recreate

browser:
  engine: chromium
  workers: 1
  warmupSamples: 10
  measuredSamples: 30
  viewport: { width: 1365, height: 768 }
  cacheProfile: cold-browser-context
  prefetch: disabled
  operations: [list, detail, create, update, delete]

scenarios:
  - id: volume-large-writes
    kind: volume
    counts: { list: 2000, detail: 1000, create: 500, update: 500, delete: 500 }
    concurrency: 25
    maxAttemptsPerOperation: 650
    maxDurationSeconds: 1800
    resetBefore: true
  - id: capacity-large-mixed
    kind: capacity
    weights: { list: 40, detail: 20, create: 15, update: 15, delete: 10 }
    ratesPerSecond: [20, 50, 100, 200]
    durationPerStepSeconds: 120
    preallocatedVUs: 100
    maxVUs: 400
    resetBefore: true

network:
  browserToAppAddedRttMs: 0
  appToApiAddedRttMs: 0

resources:
  appCpus: 4
  appMemoryMb: 4096
  dbCpus: 4
  dbMemoryMb: 4096

load:
  generatorMaxCpuPercent: 75

stages:
  correctness: true
  render: true
  load: true

report:
  keepRawSamples: true
  outputFormats: [json, csv, html]
