# Variant manifest — next-orpc (next-fullstack). Plan §4, schema v2.
# oRPC procedures; reads on the server, mutations over the procedure contract.
schemaVersion: 2
id: next-orpc
cohort: next-fullstack
appDirectory: ../apps/next-orpc
composeFile: ../apps/next-orpc/compose.yaml
projectPrefix: bench-next-orpc
services:
  app:
    {
      composeService: app,
      kind: app,
      healthPath: /healthz,
      hostPortEnv: APP_PORT,
    }
  db: { composeService: db, kind: db }
  seeder: { composeService: seeder, kind: seeder }
seed: { command: [compose, run, --rm, seeder, seed] }
reset: { command: [compose, run, --rm, seeder, reset] }
load: { service: app, paths: ["/projects", "/projects/1", "/tasks/1"] }
capabilities: [list, detail, create, update, delete, create-with-comment]
readMode: rsc-orpc
mutationMode: orpc
orm: none
