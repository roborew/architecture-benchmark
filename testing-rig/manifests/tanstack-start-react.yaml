# Variant manifest — tanstack-start-react (tanstack-start). Plan §4, schema v2.
# Single SSR service: TanStack Start server functions read Postgres directly.
schemaVersion: 2
id: tanstack-start-react
cohort: tanstack-start
appDirectory: ../apps/tanstack-start-react
composeFile: ../apps/tanstack-start-react/compose.yaml
projectPrefix: bench-tanstack-start-react
services:
  app: { composeService: app, kind: app, healthPath: /healthz, hostPortEnv: APP_PORT }
  db: { composeService: db, kind: db }
  seeder: { composeService: seeder, kind: seeder }
seed: { command: [compose, run, --rm, seeder, seed] }
reset: { command: [compose, run, --rm, seeder, reset] }
capabilities: [list, detail, create, update, delete, create-with-comment]
readMode: server-fn-direct-db
mutationMode: server-fn
orm: none
