# Variant manifest — tanstack-express-rest (spa-api). Plan §4, schema v2.
# A SPA half and an API half in one stack; the SPA is built with VITE_API_URL
# pointing at the API's allocated host port (token resolved before build).
schemaVersion: 2
id: tanstack-express-rest
cohort: spa-api
appDirectory: ../apps/tanstack-express-rest
composeFile: ../apps/tanstack-express-rest/compose.yaml
projectPrefix: bench-tanstack-express-rest
services:
  api:
    {
      composeService: api,
      kind: api,
      healthPath: /healthz,
      hostPortEnv: API_PORT,
    }
  spa:
    composeService: spa
    kind: spa
    healthPath: /
    hostPortEnv: SPA_PORT
    buildArgs: { VITE_API_URL: "http://localhost:{{API_PORT}}" }
  db: { composeService: db, kind: db }
  seeder: { composeService: seeder, kind: seeder }
seed: { command: [compose, run, --rm, seeder, seed] }
reset: { command: [compose, run, --rm, seeder, reset] }
load:
  {
    service: api,
    paths: ["/api/projects", "/api/tasks?limit=25", "/api/tasks/1"],
  }
capabilities: [list, detail, create, update, delete, create-with-comment]
readMode: spa-fetch-rest
mutationMode: rest
orm: none
