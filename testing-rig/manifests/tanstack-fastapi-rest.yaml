# Variant manifest — tanstack-fastapi-rest (spa-api). Plan §4, schema v2.
# The API half is FastAPI served by uvicorn; the worker/loop setting is an
# architecture choice recorded in the API image/README.
schemaVersion: 2
id: tanstack-fastapi-rest
cohort: spa-api
appDirectory: ../apps/tanstack-fastapi-rest
composeFile: ../apps/tanstack-fastapi-rest/compose.yaml
projectPrefix: bench-tanstack-fastapi-rest
services:
  api: { composeService: api, kind: api, healthPath: /healthz, hostPortEnv: API_PORT }
  spa:
    composeService: spa
    kind: spa
    healthPath: /
    hostPortEnv: SPA_PORT
    buildArgs: { VITE_API_URL: "http://localhost:{{API_PORT}}" }
  db: { composeService: db, kind: db }
  seeder: { composeService: seeder, kind: seeder }
seed: { command: [compose, run, --rm, seeder, seed] }
reset: { command: [compose, run, --rm, seeder, reset] }
capabilities: [list, detail, create, update, delete, create-with-comment]
readMode: spa-fetch-rest
mutationMode: rest
orm: none
